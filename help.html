<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">Measured on the finished jeans, all the way around. Inseam is 71 cm for Short, 76 for Regular and 81 for Long. {{cutNote}}</p>

<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; font-size: 13px;">The shaded row, W80, is a measured sample. The other rows follow our grading: for every 4 cm of waist, hip goes up 4, thigh 2.4, knee 1.6 and hem 1.2.</p>
<a href="fit.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: transparent; color: #1B2240; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; align-self: flex-start;">Compare with your own pair</a>

<details style="border-top: 1px solid #EEF0F4; padding: 14px 0;"><summary style="font-size: 16px; font-weight: 500; cursor: pointer;">Do I have to measure myself?</summary><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px; margin-top: 10px;">No. You measure a pair of jeans you already like, laid flat. It's quicker, and it tells us how you like jeans to sit.</p></details>
<details style="border-top: 1px solid #EEF0F4; padding: 14px 0;"><summary style="font-size: 16px; font-weight: 500; cursor: pointer;">Will they shrink?</summary><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px; margin-top: 10px;">[Shrinkage after the first wash, in %, to confirm with the mill.]</p></details>
<details style="border-top: 1px solid #EEF0F4; padding: 14px 0;"><summary style="font-size: 16px; font-weight: 500; cursor: pointer;">What's the paper card in my parcel?</summary><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px; margin-top: 10px;">It's a small version of the cut you bought, made from the same pattern. You can unfold it and roll the cuffs. The pocket card that comes with it has a link to your saved fit.</p></details>
<details style="border-top: 1px solid #EEF0F4; padding: 14px 0;"><summary style="font-size: 16px; font-weight: 500; cursor: pointer;">Can I hold a one-of-one while I decide?</summary><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px; margin-top: 10px;">Yes, for 15 minutes once it's in your bag. After that it goes back on sale.</p></details>

<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cut: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var cuts = [ { name: 'Straight', hip: 106, thigh: 64, knee: 46, hem: 42, note: 'The Straight has a medium amount of room down the leg.' }, { name: 'Wide', hip: 112, thigh: 72, knee: 58, hem: 56, note: 'The Wide has the most room in the thigh and a wide, straight hem.' }, { name: 'Taper', hip: 108, thigh: 66, knee: 42, hem: 34, note: 'The Taper has room in the thigh and narrows below the knee.' } ];
    var c = cuts[st.cut], f = function (v) { return (Math.round(v * 10) / 10).toFixed(1).replace('.0', ''); };
    return {
      tabs: cuts.map(function (x, i) { var on = i === st.cut; return { label: x.name, on: on ? 'true' : 'false', bg: on ? '#1B2240' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2240', pick: function () { self.setState({ cut: i }); } }; }),
      rows: [72, 76, 80, 84, 88, 92].map(function (W) { var k = (W - 80) / 4; return { size: 'W' + W, waist: W, hip: f(c.hip + 4 * k), thigh: f(c.thigh + 2.4 * k), knee: f(c.knee + 1.6 * k), hem: f(c.hem + 1.2 * k), bg: W === 80 ? '#EEF0F4' : 'transparent' }; }),
      cutNote: c.note,
      noSubmit: function (e) { e.preventDefault(); }
    };
  }
}

DC.mount(Component, {});
</script>
