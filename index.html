<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #596079;">Spring collection</p>
<h1 id="hero-title" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em;">Jeans cut from real patterns.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 18px; max-width: 440px;">Three cuts in 18 sizes. Compare any of them with a pair you already own, before you buy.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px;">
<a href="shop.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;">Shop the cuts</a>
<a href="fit.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: transparent; color: #1B2240; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;">Find your size</a>

</div>
<div style="flex: 1.6 1 520px; min-height: clamp(380px, 46vw, 700px); position: relative; overflow: hidden;">

</div>
</section>

<a href="shop.html" style="font-size: 15px; font-weight: 500;">Shop all</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px;">
<template data-for="{{cuts}}" data-as="c">

<p style="margin: 0; font-size: 18px; font-weight: 600;">{{c.name}} · {{c.wash}}</p>
<p style="margin: 0; font-size: 16px; font-variant-numeric: tabular-nums;">{{c.price}}</p>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079;">{{c.room}}</p>
</a>

</div>
</section>

<section aria-labelledby="fit-title" style="background: #FFFFFF; border-top: 1px solid #D3D7E0; border-bottom: 1px solid #D3D7E0;">

<ol style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8;">
<li>Lay your favourite jeans flat.</li>
<li>Measure waist, hip, thigh and inseam.</li>
<li>See your size in every cut, and the difference in centimetres.</li>
</ol>
<a href="fit.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; align-self: flex-start;">Find my size</a>
</div>

<text x="43" y="107.2" font-size="3.4" font-weight="600" fill="#1B2240" font-family="Figtree">Inseam −2 cm</text>
<text x="-38" y="-2" font-size="3" fill="#596079" font-family="Figtree">Solid: Straight W80 Regular · dashed: your pair</text>
</svg>
</div>
</div>
</section>

<section aria-labelledby="models-title" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">

<img loading="lazy" decoding="async" src="{{m.img}}" alt="{{m.alt}}" style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover;">
<figcaption style="font-size: 14px; line-height: 1.45;"><strong style="font-weight: 600;">{{m.height}}</strong> · wears {{m.wears}}</figcaption>
</figure>
</template>
</div>
</section>

<section aria-labelledby="drop-title" style="background: #EFE8DA;">
<div style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 40px;">

</div>

<div style="display: flex; justify-content: space-between; gap: 8px;"><p style="margin: 0; font-size: 16px; font-weight: 600;">{{d.name}}</p><p style="margin: 0; font-size: 15px;">£120</p></div>
<p style="margin: 0; font-size: 14px; color: #5E5446;">{{d.base}} · {{d.size}}</p>
</a>
</template>
</div>
</div>

<section aria-labelledby="paper-title" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center;">

<div style="display: flex; flex-wrap: wrap; gap: 20px;"><a href="about.html" style="font-size: 15px; font-weight: 500;">How we cut</a><a href="stockists.html" style="font-size: 15px; font-weight: 500;">For shops and press</a></div>

<img loading="lazy" decoding="async" src="assets/img/print-cuffs.webp" alt="Hands rolling the paper card's cuff flap; the other flap reads Twice for attitude." style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
<img loading="lazy" decoding="async" src="assets/img/print-bundle-wall.webp" alt="The paper pattern bundle hanging from a ring under a navy wall rail in a denim shop." style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
</div>
