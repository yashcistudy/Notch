<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed · Notch</title>
<meta name="description" content="Your order is confirmed.">
<meta property="og:title" content="Order confirmed · Notch">
<meta property="og:description" content="Your order is confirmed.">
<meta property="og:image" content="https://yashcistudy.github.io/Notch/assets/og.jpg">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';src:url(assets/fonts/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap;}
@font-face{font-family:'Piscolabis';src:url(assets/fonts/piscolabis.woff2) format('woff2')}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#EEF0F4;color:#1B2240;}
a{color:#1B2240}a:hover{color:#3B45D1}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3B45D1;outline-offset:2px;}
.nx-mob{display:none}
.nx-mob>summary{list-style:none;cursor:pointer}
.nx-mob>summary::-webkit-details-marker{display:none}
.nx-bar{display:none}
@media (max-width:820px){.nx-full{display:none!important}.nx-mob{display:block}.nx-bar{display:flex}}

#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript></div>
<template id="tpl">
<div style="width: 100%; background: #EEF0F4; color: #1B2240;">
<p style="margin: 0; background: #1B2240; color: #EEF0F4; font-size: 13px; text-align: center; padding: 9px 16px;">Free size swaps within [30] days · Delivery cost shown before you pay</p>
<header style="position: relative; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); box-sizing: border-box; min-height: 68px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;">
<div style="display: flex; align-items: center;"><nav aria-label="Main" class="nx-full" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">How we cut</a></nav><details class="nx-mob"><summary style="font-size: 15px; font-weight: 600; padding: 10px 0;">Menu</summary><nav aria-label="Main, mobile" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; background: #FFFFFF; border-bottom: 1px solid #1B2240; padding: 4px clamp(16px, 4vw, 56px) 12px; display: flex; flex-direction: column; font-size: 17px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">How we cut</a><a href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Your fit and orders</a><a href="help.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0;">Help</a></nav></details></div>
<a href="index.html" aria-label="Notch home" style="display: flex; padding: 8px 0;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 26px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#1B2240" fill-rule="evenodd"></path></svg></a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 15px; font-weight: 500;"><a class="nx-full" href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Your fit</a><a href="bag.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Bag (<span data-bag-count>0</span>)</a></div>
</div>
</header>

<section aria-labelledby="ty-title" style="background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(36px, 5vw, 72px); padding-bottom: clamp(36px, 5vw, 72px); display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #596079;">Order [#1042] · confirmed</p>
<h1 id="ty-title" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em;">Thanks, your order's in.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 18px; max-width: 620px;">We've emailed the receipt to [email]. Everything ships together in [1–2] working days.</p>
</div>
</section>

<section aria-labelledby="track-title" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
<h2 id="track-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">Where your order is</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-top: 1px solid #1B2240;">
<template data-for="{{steps}}" data-as="s">
<li aria-current="{{s.current}}" style="padding: 16px 16px 16px 0; display: flex; flex-direction: column; gap: 4px; border-top: {{s.bar}}; margin-top: -1px;">
<span style="font-size: 13px; color: #596079;">{{s.state}}</span>
<span style="font-size: 18px; font-weight: 600;">{{s.title}}</span>
<span style="font-size: 14px; line-height: 1.5; color: #596079;">{{s.text}}</span>
</li>
</template>
</ol>
</section>

<section aria-labelledby="parcel-title" style="background: #FFFFFF; border-top: 1px solid #D3D7E0; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="parcel-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">What's in the parcel</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; max-width: 560px;">Along with your jeans, there's a small paper version of the Straight. Here's what to do with it.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;"><img src="assets/img/print-unboxing.webp" alt="A hand pulling a folded paper jeans card out of a kraft envelope in an opened parcel." style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover;"><figcaption style="font-size: 15px; line-height: 1.5;"><strong style="font-weight: 600;">The envelope.</strong> The card is folded at the knee, the way you'd fold the jeans.</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;"><img src="assets/img/print-cuffs.webp" alt="Two hands holding the paper card's legs; one cuff flap folded up, the other down showing a printed note." style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover;"><figcaption style="font-size: 15px; line-height: 1.5;"><strong style="font-weight: 600;">The cuffs.</strong> Roll each flap up and down. There's a short note printed under each one.</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;"><img loading="lazy" decoding="async" src="assets/img/print-pocket.webp" alt="The navy Notch pocket card sticking out of a back pocket." style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover;"><figcaption style="font-size: 15px; line-height: 1.5;"><strong style="font-weight: 600;">The pocket card.</strong> It has our socials [@handle] and a QR code that opens your saved fit.</figcaption></figure>
</div>
</div>
</section>

<section aria-label="Order details" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
<div style="flex: 1.4 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;">Your order</h2>
<template data-for="{{lines}}" data-as="l">
<div style="display: flex; gap: 16px; align-items: center; border-top: 1px solid #EEF0F4; padding-top: 14px;">
<img loading="lazy" decoding="async" src="{{l.img}}" alt="{{l.alt}}" style="width: 64px; aspect-ratio: 3 / 4; object-fit: cover; background: #EEF0F4;">
<div style="flex: 1 1 auto; min-width: 0;"><p style="margin: 0; font-size: 16px; font-weight: 600;">{{l.name}}</p><p style="margin: 2px 0 0; font-size: 14px; color: #596079;">{{l.sub}}</p></div>
<p style="margin: 0; font-size: 16px; font-variant-numeric: tabular-nums;">{{l.price}}</p>
</div>
</template>
<div style="display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid #1B2240; padding-top: 12px; font-size: 15px;"><span>Delivery to [address line 1, city, postcode]</span><span>[£X.XX]</span></div>
<div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums;"><span>Paid</span><span>{{paid}}</span></div>
</div>
<div style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;">Keep W80 Regular as your size?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240;">We'll show it first next time. When the jeans arrive, you can tell us how they fit and we'll adjust.</p>
<template data-if="{{notSaved}}"><button type="button" onClick="{{save}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; align-self: flex-start;">Save W80 Regular</button></template>
<template data-if="{{saved}}"><p style="margin: 0; font-size: 15px; font-weight: 600; color: #1E6B3C;">Saved. <a href="account.html">See your fit</a></p></template>
</div>
</section>

<footer style="background: #1B2240; color: #EEF0F4;">
<div style="max-width: 1440px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between;">
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 420px;"><p role="img" aria-label="Notch" style="margin: 0 0 8px;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 34px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#EEF0F4" fill-rule="evenodd"></path></svg></p><label for="ft-email" style="font-size: 15px; line-height: 1.5;">Hear when a Drop has a pair in your size.</label><div style="display: flex; gap: 0;"><input id="ft-email" type="email" placeholder="Email" autocomplete="email" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: inherit; font-size: 15px; border: 1px solid #EEF0F4; background: transparent; color: #EEF0F4;"><button type="submit" style="height: 46px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 600; background: #EEF0F4; color: #1B2240; border: 1px solid #EEF0F4; cursor: pointer;">Sign up</button></div><p style="margin: 0; font-size: 13px; color: #B9BED3;">Instagram · TikTok · Pinterest [@handle]</p></form>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
</div>
</template>
<script src="js/morphdom.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: false }; this.order = NotchStore.checkout(); }
  renderVals() {
    var self = this;
    var mk = function (state, title, text, cur) { return { state: state, title: title, text: text, current: cur ? 'step' : 'false', bar: cur ? '3px solid #1B2240' : '1px solid transparent' }; };
    var o = this.order && this.order.length ? this.order : [ { name: 'Straight · Rinse', size: 'W80 Regular', price: 68, qty: 1, img: 'assets/img/st-front.webp', alt: 'Straight Rinse.' } ];
    var total = o.reduce(function (n, x) { return n + x.price * x.qty; }, 0);
    return {
      steps: [ mk('Done', 'Ordered', 'Just now. Receipt sent.', false), mk('Now', 'Packing', 'Folded with the paper card and the pocket card.', true), mk('Next', 'Shipped', '[date]. We’ll email the tracking link.', false), mk('Then', 'Delivered', '[date], [2–4] working days.', false) ],
      lines: o.map(function (x) { return { name: x.name, sub: x.size + ' · ' + x.qty, price: '£' + x.price * x.qty, img: x.img, alt: x.alt }; }),
      paid: '£' + total + ' + delivery',
      saved: this.state.saved, notSaved: !this.state.saved,
      save: function () { self.setState({ saved: true }); },
      noSubmit: function (e) { e.preventDefault(); }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
