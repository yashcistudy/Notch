<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H1 · Drop 01 · Notch</title>
<meta name="description" content="H1, a hand-printed one-of-one from Drop 01, with its own measurements.">
<meta property="og:title" content="H1 · Drop 01 · Notch">
<meta property="og:description" content="H1, a hand-printed one-of-one from Drop 01, with its own measurements.">
<meta property="og:image" content="https://yashcistudy.github.io/notch/assets/og.jpg">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';src:url(assets/fonts/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap;}
@font-face{font-family:'Piscolabis';src:url(assets/fonts/piscolabis.woff2) format('woff2')}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#EEF0F4;color:#1B2240;}
a{color:#1B2240}a:hover{color:#3B45D1}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3B45D1;outline-offset:2px;}
.nx-mob{display:none}
.nx-mob>summary{list-style:none;cursor:pointer}
.nx-mob>summary::-webkit-details-marker{display:none}
.nx-bar{display:none}
@media (max-width:820px){.nx-full{display:none!important}.nx-mob{display:block}.nx-bar{display:flex}}

#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript></div>
<template id="tpl">
<div style="width: 100%; background: #EEF0F4; color: #1B2240;">
<p style="margin: 0; background: #1B2240; color: #EEF0F4; font-size: 13px; text-align: center; padding: 9px 16px;">Free size swaps within [30] days · Delivery cost shown before you pay</p>
<header style="position: relative; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); box-sizing: border-box; min-height: 68px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;">
<div style="display: flex; align-items: center;"><nav aria-label="Main" class="nx-full" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Shop</a><a href="drop.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 10px 0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">How we cut</a></nav><details class="nx-mob"><summary style="font-size: 15px; font-weight: 600; padding: 10px 0;">Menu</summary><nav aria-label="Main, mobile" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; background: #FFFFFF; border-bottom: 1px solid #1B2240; padding: 4px clamp(16px, 4vw, 56px) 12px; display: flex; flex-direction: column; font-size: 17px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Shop</a><a href="drop.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">How we cut</a><a href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Your fit and orders</a><a href="help.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0;">Help</a></nav></details></div>
<a href="index.html" aria-label="Notch home" style="display: flex; padding: 8px 0;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 26px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#1B2240" fill-rule="evenodd"></path></svg></a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 15px; font-weight: 500;"><a class="nx-full" href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Your fit</a><a href="bag.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Bag (<span data-bag-count>0</span>)</a></div>
</div>
</header>

<nav aria-label="Breadcrumb" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-top: 16px; padding-bottom: 8px; font-size: 14px; color: #596079;"><a href="shop.html" style="color: #596079;">Shop all</a> / Drop 01 / H1</nav>

<main style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-bottom: clamp(48px, 6vw, 88px); display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start;">
<section aria-label="Photos" style="flex: 1.3 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<img src="assets/img/h1-045.webp" alt="H1 from the front at three-quarters: ecru wide jeans block-printed with poppy and peony shapes." style="grid-column: 1 / -1; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; background: #F6F2EA;">
<img src="assets/img/model-h1.webp" alt="Model, 172 cm, wearing H1 with a white T-shirt." style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover;">
<img loading="lazy" decoding="async" src="assets/img/h1-back.webp" alt="H1 from the back: the print carries across both back pockets." style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #F6F2EA;">
<figure style="grid-column: 1 / -1; margin: 0;">
<img loading="lazy" decoding="async" src="assets/img/h1-macro.webp" alt="Close-up of poppy and peony ink on ecru twill, with broken edges where the block lifted." style="width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block;">
<figcaption style="padding-top: 8px; font-size: 14px; color: #596079;">The rough edges are where the block lifted off the fabric.</figcaption>
</figure>
</section>

<section aria-labelledby="h1name" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; align-self: flex-start; background: {{tagBg}}; font-size: 13px; font-weight: 600; padding: 4px 10px;">{{tag}}</p>
<h1 id="h1name" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em; font-size: clamp(44px, 4.4vw, 64px);">H1 · Poppy marks</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; font-size: 15px;">Wide cut, ecru denim, block-printed by hand in poppy and peony ink. 13 oz cotton, no stretch.</p>
<p style="margin: 4px 0 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;">£120</p>
</div>

<div style="background: #EFE8DA; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;">
<p style="margin: 0; font-size: 15px; font-weight: 600;">This pair, measured after printing <span style="font-weight: 400; color: #5E5446;">· labelled W80 Regular</span></p>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums;">
<div><dt style="font-size: 13px; color: #5E5446;">Waist</dt><dd style="margin: 0; font-size: 22px; font-weight: 600;">81</dd></div>
<div><dt style="font-size: 13px; color: #5E5446;">Hip</dt><dd style="margin: 0; font-size: 22px; font-weight: 600;">112</dd></div>
<div><dt style="font-size: 13px; color: #5E5446;">Thigh</dt><dd style="margin: 0; font-size: 22px; font-weight: 600;">72</dd></div>
<div><dt style="font-size: 13px; color: #5E5446;">Inseam</dt><dd style="margin: 0; font-size: 22px; font-weight: 600;">75</dd></div>
</dl>
<template data-if="{{saved}}">
<p style="margin: 0; font-size: 14px; line-height: 1.5; border-top: 1px solid #D8CDB6; padding-top: 10px;">Against my grey straights: 1 cm looser at the waist, 5 cm roomier at the hip, 3 cm shorter.</p>
</template>
<p style="margin: 0; font-size: 13px; color: #5E5446;">cm around, except inseam. Printing and washing move a pair by about a centimetre, so we measure each one.</p>
</div>

<template data-if="{{notHeld}}">
<button type="button" onClick="{{hold}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%; min-height: 52px; font-size: 16px;">Add to bag</button>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; margin-top: -8px;">We hold it for you for 15 minutes once it's in your bag. You can return a one-of-one, but there's no other size to swap it for.</p>
</template>
<template data-if="{{held}}">
<div role="status" style="background: #FFFFFF; border: 1px solid #1B2240; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; font-size: 16px; font-weight: 600;">It's in your bag and held until 14:27.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.5;">Nobody else can buy it while it's held. After that it goes back on sale.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px;"><a href="bag.html" style="font-size: 15px; font-weight: 600;">Go to bag</a><button type="button" onClick="{{release}}" style="font-family: inherit; background: none; border: 0; padding: 0; font-size: 15px; color: #1B2240; text-decoration: underline; cursor: pointer;">Remove it</button></div>
</div>
</template>
</section>
</main>

<section aria-labelledby="mto" style="background: #EFE8DA;">
<div style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center;">
<img loading="lazy" decoding="async" src="{{inkImg}}" alt="{{inkAlt}}" style="flex: 1 1 300px; min-width: 0; width: 100%; max-width: 480px; aspect-ratio: 2 / 3; object-fit: cover; background: #F6F2EA;">
<div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 16px;">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #596079; color: #8A3A22;">Not your size?</p>
<h2 id="mto" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">We can print the same marks on a pair in your size</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; max-width: 480px;">Pick one ink and any waist and length. We print it by hand after you order, so yours will look close to H1 but not the same.</p>
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 10px;">Ink: <span style="font-weight: 400;">{{inkName}}</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-for="{{inks}}" data-as="k">
<button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="font-family: inherit; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; background: #FFFFFF; border: {{k.border}}; color: #1B2240; font-size: 15px; cursor: pointer;"><span aria-hidden="true" style="width: 28px; height: 28px; background: {{k.hex}};"></span>{{k.name}}</button>
</template>
</div>
</fieldset>
<p style="margin: 0; font-size: 15px; line-height: 1.5;">Wide cut, W72 to W92, Short, Regular or Long. <strong style="font-weight: 600; font-variant-numeric: tabular-nums;">£128</strong>, ready in [3–4] weeks.</p>
<a href="product.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; align-self: flex-start;">Choose a size</a>
</div>
</div>
</section>

<section aria-labelledby="rest" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
<h2 id="rest" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">The rest of Drop 01</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
<template data-for="{{rest}}" data-as="r">
<a href="drop.html" style="color: #1B2240; text-decoration: none; display: flex; flex-direction: column; gap: 8px; opacity: {{r.fade}};">
<div style="position: relative;"><img loading="lazy" decoding="async" src="{{r.img}}" alt="{{r.alt}}" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #F6F2EA; display: block;"><span style="position: absolute; left: 8px; top: 8px; background: #FFFFFF; font-size: 12px; font-weight: 600; padding: 4px 8px;">{{r.tag}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px;"><p style="margin: 0; font-size: 16px; font-weight: 600;">{{r.name}}</p><p style="margin: 0; font-size: 15px;">£120</p></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079;">{{r.base}} · {{r.size}}</p>
</a>
</template>
</div>
</section>

<img loading="lazy" decoding="async" src="assets/img/drop-rail.webp" alt="All four Drop 01 pairs hanging side by side on a steel rail." style="width: 100%; height: clamp(320px, 40vw, 600px); object-fit: cover; display: block;">

<footer style="background: #1B2240; color: #EEF0F4;">
<div style="max-width: 1440px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between;">
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 420px;"><p role="img" aria-label="Notch" style="margin: 0 0 8px;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 34px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#EEF0F4" fill-rule="evenodd"></path></svg></p><label for="ft-email" style="font-size: 15px; line-height: 1.5;">Hear when a Drop has a pair in your size.</label><div style="display: flex; gap: 0;"><input id="ft-email" type="email" placeholder="Email" autocomplete="email" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: inherit; font-size: 15px; border: 1px solid #EEF0F4; background: transparent; color: #EEF0F4;"><button type="submit" style="height: 46px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 600; background: #EEF0F4; color: #1B2240; border: 1px solid #EEF0F4; cursor: pointer;">Sign up</button></div><p style="margin: 0; font-size: 13px; color: #B9BED3;">Instagram · TikTok · Pinterest [@handle]</p></form>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
</div>
</template>
<script src="js/morphdom.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { held: NotchStore.has('H1'), ink: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var inkList = [
      { name: 'Poppy', hex: '#E5452F', img: 'assets/img/ink-poppy.webp' },
      { name: 'Ultramarine', hex: '#3B45D1', img: 'assets/img/ink-ultramarine.webp' },
      { name: 'Chartreuse', hex: '#C9DB3B', img: 'assets/img/ink-chartreuse.webp' }
    ];
    var k = inkList[st.ink];
    return {
      saved: this.props.savedFit ?? true,
      held: st.held, notHeld: !st.held,
      tag: st.held ? 'Held for you' : 'One of one · available', tagBg: st.held ? '#FFFFFF' : '#EFE8DA',
      bagCount: '0',
      hold: function () { notchAdd({ key: 'H1', single: true, name: 'H1 · Poppy marks', size: 'One of one · W80 Regular', price: 120, img: 'assets/img/h1-front.webp', alt: 'H1: ecru wide jeans with hand-printed poppy and peony marks.', href: 'drop.html', fit: 'Fit check: measured after printing, 5 cm roomier at the hip and 3 cm shorter than your pair.' }); self.setState({ held: true }); }, release: function () { NotchStore.remove('H1'); self.setState({ held: false }); },
      inks: inkList.map(function (x, i) { return { name: x.name, hex: x.hex, on: i === st.ink ? 'true' : 'false', border: i === st.ink ? '2px solid #1B2240' : '1px solid #D3D7E0', pick: function () { self.setState({ ink: i }); } }; }),
      inkName: k.name, inkImg: k.img, inkAlt: 'The H1 marks printed in ' + k.name.toLowerCase() + ' on an ecru Wide pair, front view.',
      noSubmit: function (e) { e.preventDefault(); },
      rest: [
        { name: 'H2 · Seam dashes', base: 'Rinse Straight', size: 'W84 Long', tag: 'Available', fade: 1, img: 'assets/img/h2-front.webp', alt: 'H2: rinse straight jeans with chartreuse dashes down one side seam.' },
        { name: 'H3 · Hem bands', base: 'Ecru Taper', size: 'W76 Short', tag: 'In a bag', fade: 1, img: 'assets/img/h3-front.webp', alt: 'H3: ecru taper jeans with ultramarine and lilac hem bands.' },
        { name: 'H4 · One peony', base: 'Light Straight', size: 'W88 Regular', tag: 'Sold', fade: 0.55, img: 'assets/img/h4-back.webp', alt: 'H4: light-wash straight jeans with one peony shape on the back thigh.' }
      ]
    };
  }
}

DC.mount(Component, {"savedFit": true});
</script>
</body>
</html>
