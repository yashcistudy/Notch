<!doctype html>
<html lang="en">
<head>

<style>
@font-face{font-family:'Figtree';src:url(assets/fonts/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap;}
@font-face{font-family:'Piscolabis';src:url(assets/fonts/piscolabis.woff2) format('woff2')}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#EEF0F4;color:#1B2240;}
a{color:#1B2240}a:hover{color:#3B45D1}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3B45D1;outline-offset:2px;}
.nx-mob{display:none}
.nx-mob>summary{list-style:none;cursor:pointer}
.nx-mob>summary::-webkit-details-marker{display:none}
.nx-bar{display:none}
@media (max-width:820px){.nx-full{display:none!important}.nx-mob{display:block}.nx-bar{display:flex}}

#app{min-height:100vh}

<body>
<div id="app"><noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript></div>
<template id="tpl">
<div style="width: 100%; background: #EEF0F4; color: #1B2240;">

<header style="position: relative; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); box-sizing: border-box; min-height: 68px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;">
<div style="display: flex; align-items: center;"><nav aria-label="Main" class="nx-full" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">How we cut</a></nav><details class="nx-mob"><summary style="font-size: 15px; font-weight: 600; padding: 10px 0;">Menu</summary><nav aria-label="Main, mobile" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; background: #FFFFFF; border-bottom: 1px solid #1B2240; padding: 4px clamp(16px, 4vw, 56px) 12px; display: flex; flex-direction: column; font-size: 17px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">How we cut</a><a href="account.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Your fit and orders</a><a href="help.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0;">Help</a></nav></details></div>

</div>
</header>

<section aria-labelledby="acc-title" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(28px, 4vw, 56px); padding-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 40px;">
<div style="display: flex; flex-direction: column; gap: 10px;">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079;">Signed in as [name] · <a href="index.html" style="color: #596079;">Sign out</a></p>
<h1 id="acc-title" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em;">Your fit and orders</h1>
</div>
</section>

<section aria-label="Account" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-bottom: clamp(48px, 6vw, 96px); display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;">Saved pair</h2>
<a href="fit.html" style="font-size: 15px;">Edit</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center;">
<svg viewBox="-34 -4 68 112" style="width: 104px; height: auto;" role="img" aria-label="Outline of the saved pair."><path d="M-20 0 L20 0 L26.75 20 L32.5 29 L23.4 63 L23.45 107 L2 107 L2 63 L0 31 L-2 63 L-2 107 L-23.45 107 L-23.4 63 L-32.5 29 L-26.75 20 Z" fill="#EEF0F4" stroke="#3B45D1" stroke-width="0.9" stroke-dasharray="2.4 1.4" stroke-linejoin="round"></path></svg>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; font-size: 18px; font-weight: 600;">my grey straights</p>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums;">
<div><dt style="font-size: 13px; color: #596079;">Waist</dt><dd style="margin: 0; font-size: 20px; font-weight: 600;">80</dd></div>
<div><dt style="font-size: 13px; color: #596079;">Hip</dt><dd style="margin: 0; font-size: 20px; font-weight: 600;">107</dd></div>
<div><dt style="font-size: 13px; color: #596079;">Thigh</dt><dd style="margin: 0; font-size: 20px; font-weight: 600;">65</dd></div>
<div><dt style="font-size: 13px; color: #596079;">Inseam</dt><dd style="margin: 0; font-size: 20px; font-weight: 600;">78</dd></div>
</dl>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; font-size: 13px;">cm, measured flat and doubled · saved 28 Oct</p>
</div>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column;">
<h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 600; line-height: 1.3;">Your size in each cut</h2>
<template data-for="{{sizes}}" data-as="s">
<a href="{{s.href}}" style="color: #1B2240; text-decoration: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 0; border-top: 1px solid #EEF0F4;">
<span style="font-size: 16px;"><strong style="font-weight: 600;">{{s.cut}}</strong> · {{s.size}}</span>
<span style="font-size: 14px; color: #596079;">{{s.note}}</span>
</a>
</template>
</div>
</div>

<div style="flex: 1.2 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;">Orders</h2>
<div style="border-top: 1px solid #EEF0F4; padding-top: 16px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;"><strong style="font-size: 16px; font-weight: 600;">[#1042] · £188</strong><span style="font-size: 14px; color: #1E6B3C;">Delivered [date]</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
<img src="assets/img/st-front.webp" alt="Straight Rinse." style="width: 64px; aspect-ratio: 3 / 4; object-fit: cover; background: #EEF0F4;">
<img src="assets/img/h1-front.webp" alt="H1 hand-printed." style="width: 64px; aspect-ratio: 3 / 4; object-fit: cover; background: #EFE8DA;">
<p style="margin: 0; flex: 1 1 200px; font-size: 15px; line-height: 1.5;">Straight Rinse, W80 Regular<br>H1 · Poppy marks, one of one</p>
</div>
<fieldset style="margin: 0; border: 1px solid #D3D7E0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 15px; font-weight: 600; padding: 0 6px;">How does the Straight fit?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-for="{{fb}}" data-as="o">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="font-family: inherit; min-height: 44px; padding: 0 14px; font-size: 15px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid #1B2240;">{{o.label}}</button>
</template>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079;">{{fbText}}</p>
</fieldset>
<a href="help.html" style="font-size: 15px; align-self: flex-start;">Swap for another size</a>
</div>
<div style="border-top: 1px solid #EEF0F4; padding-top: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;">
<div><strong style="font-size: 16px; font-weight: 600;">[#0981] · £74</strong><p style="margin: 4px 0 0; font-size: 15px;">Wide Ecru W84 Regular, swapped for W80 Regular</p></div>
<span style="font-size: 14px; color: #596079;">Swapped [date]</span>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3;">Details</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6;">[email]<br>[address line 1, city, postcode]</p>
<label style="display: inline-flex; align-items: center; gap: 10px; font-size: 15px; min-height: 44px; cursor: pointer;"><input type="checkbox" checked="{{alerts}}" onChange="{{toggleAlerts}}" style="width: 20px; height: 20px; accent-color: #1B2240;">Email me when a Drop has a pair in my size</label>
</div>
</div>
</section>

<footer style="background: #1B2240; color: #EEF0F4;">
<div style="max-width: 1440px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between;">
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 420px;"><p role="img" aria-label="Notch" style="margin: 0 0 8px;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 34px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#EEF0F4" fill-rule="evenodd"></path></svg></p><label for="ft-email" style="font-size: 15px; line-height: 1.5;">Hear when a Drop has a pair in your size.</label><div style="display: flex; gap: 0;"><input id="ft-email" type="email" placeholder="Email" autocomplete="email" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: inherit; font-size: 15px; border: 1px solid #EEF0F4; background: transparent; color: #EEF0F4;"><button type="submit" style="height: 46px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 600; background: #EEF0F4; color: #1B2240; border: 1px solid #EEF0F4; cursor: pointer;">Sign up</button></div><p style="margin: 0; font-size: 13px; color: #B9BED3;">Instagram · TikTok · Pinterest [@handle]</p></form>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
</div>
</template>
<script src="js/morphdom.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fb: -1, alerts: true }; }
  renderVals() {
    var self = this, st = this.state;
    var opts = ['Too tight', 'Fits well', 'Too loose'];
    var texts = ['Thanks. Next time we’ll suggest W84 and show you the difference first.', 'Thanks. We’ll keep W80 Regular as your Straight size.', 'Thanks. Next time we’ll suggest W76 and show you the difference first.'];
    return {
      fb: opts.map(function (o, i) { var on = i === st.fb; return { label: o, on: on ? 'true' : 'false', bg: on ? '#1B2240' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2240', pick: function () { self.setState({ fb: i }); } }; }),
      fbText: st.fb < 0 ? 'Your answer changes the size we suggest next time.' : texts[st.fb],
      alerts: st.alerts, toggleAlerts: function () { self.setState({ alerts: !st.alerts }); },
      noSubmit: function (e) { e.preventDefault(); },
      sizes: [
        { cut: 'Straight', size: 'W80 Regular', note: '1 cm closer at the hip, 2 cm shorter', href: 'product.html' },
        { cut: 'Wide', size: 'W80 Regular', note: '5 cm roomier at the hip, 7 cm in the thigh', href: 'shop.html' },
        { cut: 'Taper', size: 'W80 Regular', note: 'Hip about the same, narrow 34 cm hem', href: 'shop.html' }
      ]
    };
  }
}

DC.mount(Component, {});
</script>
</body>
