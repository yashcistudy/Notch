<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straight · Rinse · Notch</title>
<meta name="description" content="Straight cut in 13 oz rinse denim. Pick your waist and length and compare it with your own jeans.">
<meta property="og:title" content="Straight · Rinse · Notch">
<meta property="og:description" content="Straight cut in 13 oz rinse denim. Pick your waist and length and compare it with your own jeans.">
<meta property="og:image" content="https://yashcistudy.github.io/notch/assets/og.jpg">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';src:url(assets/fonts/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap;}
@font-face{font-family:'Piscolabis';src:url(assets/fonts/piscolabis.woff2) format('woff2')}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#EEF0F4;color:#1B2240;}
a{color:#1B2240}a:hover{color:#3B45D1}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3B45D1;outline-offset:2px;}
.nx-mob{display:none}
.nx-mob>summary{list-style:none;cursor:pointer}
.nx-mob>summary::-webkit-details-marker{display:none}
.nx-bar{display:none}
@media (max-width:820px){.nx-full{display:none!important}.nx-mob{display:block}.nx-bar{display:flex}}

#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript></div>
<template id="tpl">
<div style="width: 100%; background: #EEF0F4; color: #1B2240;">
<p style="margin: 0; background: #1B2240; color: #EEF0F4; font-size: 13px; text-align: center; padding: 9px 16px;">Free size swaps within [30] days · Delivery cost shown before you pay</p>
<header style="position: relative; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); box-sizing: border-box; min-height: 68px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;">
<div style="display: flex; align-items: center;"><nav aria-label="Main" class="nx-full" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500;"><a href="shop.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 10px 0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">How we cut</a></nav><details class="nx-mob"><summary style="font-size: 15px; font-weight: 600; padding: 10px 0;">Menu</summary><nav aria-label="Main, mobile" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; background: #FFFFFF; border-bottom: 1px solid #1B2240; padding: 4px clamp(16px, 4vw, 56px) 12px; display: flex; flex-direction: column; font-size: 17px; font-weight: 500;"><a href="shop.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">How we cut</a><a href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Your fit and orders</a><a href="help.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0;">Help</a></nav></details></div>
<a href="index.html" aria-label="Notch home" style="display: flex; padding: 8px 0;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 26px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#1B2240" fill-rule="evenodd"></path></svg></a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 15px; font-weight: 500;"><a class="nx-full" href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Your fit</a><a href="bag.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Bag (<span data-bag-count>0</span>)</a></div>
</div>
</header>

<nav aria-label="Breadcrumb" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-top: 16px; padding-bottom: 8px; font-size: 14px; color: #596079;"><a href="shop.html" style="color: #596079;">Shop all</a> / Straight · Rinse</nav>

<main style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-bottom: clamp(48px, 6vw, 88px); display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start;">

<section aria-label="Photos" style="flex: 1.3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<img src="{{mainImg}}" alt="{{mainAlt}}" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; background: #FFFFFF;">
<div role="group" aria-label="Choose a photo" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
<template data-for="{{thumbs}}" data-as="t">
<button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" aria-pressed="{{t.on}}" style="flex: 0 0 76px; padding: 0; border: {{t.border}}; background: #FFFFFF; cursor: pointer;"><img src="{{t.img}}" alt="" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block;"></button>
</template>
</div>
</section>

<section aria-labelledby="pname" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 id="pname" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em; font-size: clamp(44px, 4.4vw, 64px);">Straight</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; font-size: 15px;">Rinse · 13 oz cotton, no stretch</p>
<p style="margin: 4px 0 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums;">£68</p>
</div>

<template data-if="{{saved}}">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
<p style="margin: 0; font-size: 15px;"><strong style="font-weight: 600;">Your saved fit suggests W80 Regular.</strong></p>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079;">{{fitLine}}</p>
<button type="button" onClick="{{toggleDraw}}" aria-expanded="{{drawOpen}}" style="font-family: inherit; align-self: flex-start; background: none; border: 0; padding: 6px 0; font-size: 14px; font-weight: 500; color: #1B2240; text-decoration: underline; cursor: pointer;">{{drawLabel}}</button>
<template data-if="{{showDraw}}">
<svg viewBox="-40 -6 110 124" style="width: 100%; max-width: 320px; height: auto;" role="img" aria-label="{{drawAria}}">
<path d="{{notchPath}}" fill="#EEF0F4" stroke="#1B2240" stroke-width="0.5" stroke-linejoin="round"></path>
<path d="{{pairPath}}" fill="none" stroke="#596079" stroke-width="0.5" stroke-dasharray="1.6 1.2" stroke-linejoin="round"></path>
<text x="-38" y="-2" font-size="3.2" fill="#596079" font-family="Figtree">Solid: Straight {{sizeShort}} · dashed: my grey straights</text>
</svg>
</template>
</div>
</template>
<template data-if="{{notSaved}}">
<p style="margin: 0; font-size: 15px; background: #FFFFFF; border: 1px solid #D3D7E0; padding: 14px 16px;">Not sure of your size? <a href="fit.html">Compare with a pair you own</a></p>
</template>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 10px;">Waist <span style="font-weight: 400; color: #596079;">· cm</span></legend>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px;">
<template data-for="{{waists}}" data-as="w">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="font-family: inherit; position: relative; min-height: 48px; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; background: {{w.bg}}; color: {{w.fg}}; border: 1px solid #1B2240;">{{w.label}}<template data-if="{{w.yours}}"><span aria-label="your size" style="position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; background: {{w.dot}};"></span></template></button>
</template>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 10px;">Length <span style="font-weight: 400; color: #596079;">· inseam</span></legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<template data-for="{{lengths}}" data-as="l">
<button type="button" aria-pressed="{{l.on}}" disabled="{{l.out}}" onClick="{{l.pick}}" style="font-family: inherit; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; cursor: pointer; background: {{l.bg}}; color: {{l.fg}}; border: 1px solid {{l.border}}; text-decoration: {{l.strike}};"><svg aria-hidden="true" viewBox="0 0 20 16" style="width: 16px; height: 13px;"><path d="{{l.icon}}" fill="currentColor" fill-rule="evenodd"></path></svg>{{l.label}}</button>
</template>
</div>
</fieldset>
<p style="margin: 0; font-size: 14px; color: {{stockColor}};">{{stockText}}</p>

<div style="display: flex; flex-direction: column; gap: 10px;">
<button type="button" onClick="{{add}}" disabled="{{cantAdd}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%; min-height: 52px; font-size: 16px;">{{addLabel}}</button>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #596079;">Free size swap within [30] days. Delivery cost shown before you pay. Ships in [1–2] working days.</p>
</div>

<div style="border-top: 1px solid #D3D7E0;">
<details open style="border-bottom: 1px solid #D3D7E0; padding: 14px 0;">
<summary style="cursor: pointer; font-size: 16px; font-weight: 600;">Measurements · {{sizeShort}}</summary>
<table style="margin-top: 12px; border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums;">
<tbody>
<template data-for="{{meas}}" data-as="m">
<tr style="border-top: 1px solid #EEF0F4;"><th scope="row" style="padding: 7px 0; text-align: left; font-weight: 400; color: #596079;">{{m.k}}</th><td style="text-align: right; font-weight: 600;">{{m.v}} cm</td></tr>
</template>
</tbody>
</table>
<p style="margin: 8px 0 0; font-size: 13px; color: #596079;">Finished garment, measured around. W80 is a measured sample; other sizes use proposed grading. <a href="help.html" style="color: #596079;">Size tables</a></p>
</details>
<details style="border-bottom: 1px solid #D3D7E0; padding: 14px 0;">
<summary style="cursor: pointer; font-size: 16px; font-weight: 600;">Fabric and care</summary>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6;">13 oz cotton denim, rinse washed, no stretch. Wash cold, inside out. Rinse can mark light fabric for the first few wears.</p>
</details>
<details style="border-bottom: 1px solid #D3D7E0; padding: 14px 0;">
<summary style="cursor: pointer; font-size: 16px; font-weight: 600;">Delivery, swaps and returns</summary>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6;">UK [2–4] working days, [£X.XX]. Swap for another size free within [30] days, or return within [14] days. <a href="help.html">All the details</a></p>
</details>
</div>
</section>
</main>

<section aria-labelledby="models-title" style="background: #FFFFFF; border-top: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: flex-start;">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px;">
<h2 id="models-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">On the models</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #596079; font-size: 15px; max-width: 360px;">Height and size on every photo, so you can find someone built like you.</p>
</div>
<figure style="flex: 1 1 240px; margin: 0; display: flex; flex-direction: column; gap: 8px;"><img loading="lazy" decoding="async" src="assets/img/model-183.webp" alt="Model, 183 cm, in Straight Rinse W84 Long." style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover;"><figcaption style="font-size: 14px;"><strong style="font-weight: 600;">183 cm</strong> · wears W84 Long</figcaption></figure>
<figure style="flex: 1 1 240px; margin: 0; display: flex; flex-direction: column; gap: 8px;"><img loading="lazy" decoding="async" src="assets/img/model-seated.webp" alt="Model in a wheelchair wearing Straight Rinse W84 Regular and a red top." style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover;"><figcaption style="font-size: 14px;"><strong style="font-weight: 600;">168 cm, seated</strong> · wears W84 Regular</figcaption></figure>
</div>
</section>

<section aria-labelledby="paper-title" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center;">
<img loading="lazy" decoding="async" src="assets/img/print-cuffs.webp" alt="Hands rolling the cuff flap of the paper jeans card that comes in every parcel." style="flex: 0 1 360px; min-width: 0; width: 100%; aspect-ratio: 1; object-fit: cover;">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px;">
<h2 id="paper-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">There's a paper version in the parcel</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; max-width: 460px;">Your parcel includes a small card cut in the shape of the Straight. You can unfold it and roll up the cuffs, and there's a short note printed under each one.</p>
</div>
</section>

<section aria-labelledby="more-title" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-bottom: clamp(48px, 6vw, 96px); display: flex; flex-direction: column; gap: 24px;">
<h2 id="more-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">The other cuts</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; max-width: 760px;">
<a href="shop.html" style="color: #1B2240; text-decoration: none; display: flex; flex-direction: column; gap: 10px;"><img loading="lazy" decoding="async" src="assets/img/wd-front.webp" alt="Wide cut in ecru denim." style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #FFFFFF;"><span style="display: flex; justify-content: space-between; font-size: 16px;"><strong style="font-weight: 600;">Wide · Ecru</strong><span>£74</span></span></a>
<a href="shop.html" style="color: #1B2240; text-decoration: none; display: flex; flex-direction: column; gap: 10px;"><img loading="lazy" decoding="async" src="assets/img/tp-front.webp" alt="Taper cut in light-wash denim." style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #FFFFFF;"><span style="display: flex; justify-content: space-between; font-size: 16px;"><strong style="font-weight: 600;">Taper · Light</strong><span>£70</span></span></a>
</div>
</section>

<footer style="background: #1B2240; color: #EEF0F4;">
<div style="max-width: 1440px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between;">
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 420px;"><p role="img" aria-label="Notch" style="margin: 0 0 8px;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 34px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#EEF0F4" fill-rule="evenodd"></path></svg></p><label for="ft-email" style="font-size: 15px; line-height: 1.5;">Hear when a Drop has a pair in your size.</label><div style="display: flex; gap: 0;"><input id="ft-email" type="email" placeholder="Email" autocomplete="email" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: inherit; font-size: 15px; border: 1px solid #EEF0F4; background: transparent; color: #EEF0F4;"><button type="submit" style="height: 46px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 600; background: #EEF0F4; color: #1B2240; border: 1px solid #EEF0F4; cursor: pointer;">Sign up</button></div><p style="margin: 0; font-size: 13px; color: #B9BED3;">Instagram · TikTok · Pinterest [@handle]</p></form>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
<div class="nx-bar" aria-hidden="true" style="height: 70px; background: #1B2240;"></div>

<div class="nx-bar" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: #FFFFFF; border-top: 1px solid #1B2240; padding: 10px 16px; box-sizing: border-box; align-items: center; justify-content: space-between; gap: 12px;">
<p style="margin: 0; font-size: 14px; line-height: 1.3;"><strong style="font-weight: 600;">Straight · £68</strong><br><span style="color: #596079;">{{sizeShort}}</span></p>
<button type="button" onClick="{{add}}" disabled="{{cantAdd}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; min-height: 46px; padding: 0 20px;">Add to bag</button>
</div>
<template data-if="{{drawerOpen}}">
<div style="position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end;">
<button type="button" aria-label="Close and keep shopping" onClick="{{closeDrawer}}" style="position: absolute; inset: 0; background: rgba(27, 34, 64, 0.32); border: 0; cursor: pointer;"></button>
<div role="dialog" aria-modal="true" aria-labelledby="drawer-title" style="position: relative; width: min(420px, 100%); height: 100%; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #1B2240; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
<h2 id="drawer-title" style="margin: 0; font-size: 20px; font-weight: 600;">Added to your bag</h2>
<button type="button" onClick="{{closeDrawer}}" style="font-family: inherit; font-size: 15px; font-weight: 500; background: none; border: 0; padding: 10px 0; color: #1B2240; text-decoration: underline; cursor: pointer;">Close</button>
</div>
<div style="display: flex; gap: 16px; border-top: 1px solid #D3D7E0; padding-top: 18px;">

<p style="margin: 0; font-size: 17px; font-weight: 600;">{{dName}}</p>
<p style="margin: 0; font-size: 14px; color: #596079;">{{dSize}}</p>
<p style="margin: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{dPrice}}</p>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; background: #EEF0F4; padding: 10px 12px;">{{dFit}}</p>
<div style="display: flex; justify-content: space-between; border-top: 1px solid #D3D7E0; padding-top: 14px; font-size: 15px; font-variant-numeric: tabular-nums;"><span>Bag subtotal ({{bagCount}})</span><strong style="font-weight: 600;">{{bagTotal}}</strong></div>
<a href="order.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%;">Check out</a>
<a href="bag.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: transparent; color: #1B2240; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%;">View bag</a>
<div style="display: flex; gap: 12px; align-items: center; margin-top: auto; border-top: 1px solid #D3D7E0; padding-top: 16px;">
<img loading="lazy" decoding="async" src="assets/img/print-unboxing.webp" alt="" style="width: 64px; height: 64px; object-fit: cover;">
<p style="margin: 0; font-size: 13.5px; line-height: 1.45; color: #596079;">Every parcel includes a small paper version of your jeans and a pocket card.</p>

</template>
</div>
</template>
<script src="js/morphdom.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { img: 0, w: 2, l: 1, draw: false, drawer: false, bag: 0 }; }
  renderVals() {
    var self = this, st = this.state, saved = this.props.savedFit ?? true;
    var photos = [
      { img: 'assets/img/st-front.webp', label: 'Front', alt: 'Straight Rinse, front view.' },
      { img: 'assets/img/st-045.webp', label: 'Three-quarter', alt: 'Straight Rinse, front three-quarter view.' },
      { img: 'assets/img/st-side.webp', label: 'Side', alt: 'Straight Rinse, side view showing the straight leg line.' },
      { img: 'assets/img/st-back.webp', label: 'Back', alt: 'Straight Rinse, back view with welt pockets.' },
      { img: 'assets/img/model-183.webp', label: 'On a model', alt: 'Model, 183 cm, wearing Straight Rinse W84 Long.' },
      { img: 'assets/img/detail-fly.webp', label: 'Detail', alt: 'Close-up of the waistband, steel button and fly.' }
    ];
    var thumbs = photos.map(function (p, i) { return { img: p.img, label: 'Show ' + p.label.toLowerCase() + ' photo', on: i === st.img ? 'true' : 'false', border: i === st.img ? '1px solid #1B2240' : '1px solid #D3D7E0', pick: function () { self.setState({ img: i }); } }; });
    var sizes = [72, 76, 80, 84, 88, 92], lens = [['Short', 71], ['Regular', 76], ['Long', 81]];
    var out = { '72-Long': 1, '92-Short': 1 };
    var W = sizes[st.w];
    var slot = function (n) { var d = 'M0 0 H20 V16 H0 Z'; var xs = n === 1 ? [9] : n === 2 ? [6, 12] : [4, 9, 14]; xs.forEach(function (x) { d += ' M' + x + ' 16 V8 H' + (x + 2) + ' V16 Z'; }); return d; };
    var waists = sizes.map(function (z, i) { var on = i === st.w; return { label: 'W' + z, on: on ? 'true' : 'false', bg: on ? '#1B2240' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2240', yours: saved && z === 80, dot: on ? '#FFFFFF' : '#1B2240', pick: function () { var o = { w: i }; if (out[z + '-' + lens[st.l][0]]) o.l = 1; self.setState(o); } }; });
    var lengths = lens.map(function (x, i) { var on = i === st.l, isOut = !!out[W + '-' + x[0]]; return { label: x[0] + ' ' + x[1], icon: slot(i + 1), on: on ? 'true' : 'false', out: isOut, bg: on ? '#1B2240' : '#FFFFFF', fg: on ? '#FFFFFF' : isOut ? '#8E94A6' : '#1B2240', border: isOut ? '#D3D7E0' : '#1B2240', strike: isOut ? 'line-through' : 'none', pick: function () { self.setState({ l: i }); } }; });
    var L = lens[st.l], k = (W - 80) / 4, isOut = !!out[W + '-' + L[0]];
    var g = { waist: W, hip: 106 + 4 * k, thigh: 64 + 2.4 * k, knee: 46 + 1.6 * k, hem: 42 + 1.2 * k };
    var f1 = function (v) { return (Math.round(v * 10) / 10).toFixed(1).replace('.0', ''); };
    var pair = { waist: 80, hip: 107, thigh: 65, inseam: 78 };
    var word = function (v, more, less) { v = Math.round(v * 10) / 10; return Math.abs(v) < 1 ? null : Math.abs(v) + ' cm ' + (v > 0 ? more : less); };
    var notes = [word(W - pair.waist, 'looser at the waist', 'tighter at the waist'), word(g.hip - pair.hip, 'roomier at the hip', 'closer at the hip'), word(g.thigh - pair.thigh, 'more thigh room', 'slimmer in the thigh'), word(L[1] - pair.inseam, 'longer', 'shorter')].filter(Boolean);
    var sizeShort = 'W' + W + ' ' + L[0];
    var outline = function (m, len) {
      var a = m.waist / 4, h = m.hip / 4, oc = m.thigh / 2, kn = m.knee / 2 + 2, hm = m.hem / 2 + 2, r = 29, ky = r + 34 * len / 76, hy = r + len;
      var right = [[a, 0], [h, 20], [oc, r], [kn, ky], [hm, hy], [2, hy], [2, ky], [0, r + 2]];
      var pts = right.concat(right.slice(0, 7).reverse().map(function (p) { return [-p[0], p[1]]; }));
      return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join(' ') + ' Z';
    };
    var fitText = 'Compared with my grey straights, ' + sizeShort + ' is ' + (notes.length ? notes.join(', ') : 'within 1 cm everywhere') + '.';
    var p = photos[st.img];
    return {
      mainImg: p.img, mainAlt: p.alt, thumbs: thumbs, waists: waists, lengths: lengths,
      saved: saved, notSaved: !saved, fitLine: fitText,
      showDraw: st.draw, drawOpen: st.draw ? 'true' : 'false', drawLabel: st.draw ? 'Hide the drawing' : 'See it drawn over your pair',
      toggleDraw: function () { self.setState({ draw: !st.draw }); },
      notchPath: outline(g, L[1]), pairPath: outline({ waist: 80, hip: 107, thigh: 65, knee: 65 * 0.72, hem: 65 * 0.66 }, 78),
      drawAria: 'Straight ' + sizeShort + ' outline over your pair. ' + fitText,
      sizeShort: sizeShort,
      stockText: isOut ? sizeShort + ' is sold out. Try another length.' : sizeShort + ' · in stock', stockColor: isOut ? '#A3171C' : '#1E6B3C',
      cantAdd: isOut, addLabel: isOut ? 'Sold out in ' + sizeShort : 'Add to bag · ' + sizeShort,
      meas: [ { k: 'Waist', v: W }, { k: 'Hip', v: f1(g.hip) }, { k: 'Thigh', v: f1(g.thigh) }, { k: 'Knee', v: f1(g.knee) }, { k: 'Hem', v: f1(g.hem) }, { k: 'Inseam', v: L[1] } ],
      add: function () { if (!isOut) { notchAdd({ key: 'Straight|' + sizeShort, name: 'Straight · Rinse', size: sizeShort, price: 68, img: photos[0].img, alt: 'Straight Rinse.', href: 'product.html', fit: saved ? 'Fit check: ' + fitText : '' }); self.setState({ bag: st.bag + 1, drawer: true }); } },
      noSubmit: function (e) { e.preventDefault(); },
      bagCount: String(st.bag), bagTotal: '£' + 68 * st.bag,
      drawerOpen: st.drawer, closeDrawer: function () { self.setState({ drawer: false }); },
      dName: 'Straight · Rinse', dSize: sizeShort, dPrice: '£68', dImg: photos[0].img, dAlt: 'Straight Rinse.',
      dFit: saved ? 'Fit check: ' + fitText : 'Not sure about the size? Swaps are free within [30] days.'
    };
  }
}

DC.mount(Component, {"savedFit": true});
</script>
