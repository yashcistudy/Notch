<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bag · Notch</title>
<meta name="description" content="Your bag.">
<meta property="og:title" content="Bag · Notch">
<meta property="og:description" content="Your bag.">
<meta property="og:image" content="https://yashcistudy.github.io/Notch/assets/og.jpg">
<meta name="theme-color" content="#1B2240">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Figtree';src:url(assets/fonts/figtree.woff2) format('woff2');font-weight:300 900;font-display:swap;}
@font-face{font-family:'Piscolabis';src:url(assets/fonts/piscolabis.woff2) format('woff2')}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#EEF0F4;color:#1B2240;}
a{color:#1B2240}a:hover{color:#3B45D1}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3B45D1;outline-offset:2px;}
.nx-mob{display:none}
.nx-mob>summary{list-style:none;cursor:pointer}
.nx-mob>summary::-webkit-details-marker{display:none}
.nx-bar{display:none}
@media (max-width:820px){.nx-full{display:none!important}.nx-mob{display:block}.nx-bar{display:flex}}

#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">This shop needs JavaScript to run.</p></noscript></div>
<template id="tpl">
<div style="width: 100%; background: #EEF0F4; color: #1B2240;">
<p style="margin: 0; background: #1B2240; color: #EEF0F4; font-size: 13px; text-align: center; padding: 9px 16px;">Free size swaps within [30] days · Delivery cost shown before you pay</p>
<header style="position: relative; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); box-sizing: border-box; min-height: 68px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;">
<div style="display: flex; align-items: center;"><nav aria-label="Main" class="nx-full" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 15px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">How we cut</a></nav><details class="nx-mob"><summary style="font-size: 15px; font-weight: 600; padding: 10px 0;">Menu</summary><nav aria-label="Main, mobile" style="position: absolute; left: 0; right: 0; top: 100%; z-index: 40; background: #FFFFFF; border-bottom: 1px solid #1B2240; padding: 4px clamp(16px, 4vw, 56px) 12px; display: flex; flex-direction: column; font-size: 17px; font-weight: 500;"><a href="shop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Shop</a><a href="drop.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Drop 01</a><a href="fit.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Fit finder</a><a href="about.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">How we cut</a><a href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0; border-bottom: 1px solid #D3D7E0;">Your fit and orders</a><a href="help.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 14px 0;">Help</a></nav></details></div>
<a href="index.html" aria-label="Notch home" style="display: flex; padding: 8px 0;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 26px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#1B2240" fill-rule="evenodd"></path></svg></a>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 24px; font-size: 15px; font-weight: 500;"><a class="nx-full" href="account.html" style="color: #1B2240; text-decoration: none; text-underline-offset: 6px; padding: 10px 0;">Your fit</a><a href="bag.html" aria-current="page" style="color: #1B2240; text-decoration: underline; text-underline-offset: 6px; padding: 10px 0;">Bag (<span data-bag-count>0</span>)</a></div>
</div>
</header>

<section aria-labelledby="bag-title" style="max-width: 1440px; margin: 0 auto; padding-left: clamp(16px, 4vw, 56px); padding-right: clamp(16px, 4vw, 56px); box-sizing: border-box; padding-top: clamp(28px, 4vw, 56px); padding-bottom: clamp(48px, 6vw, 96px); display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px;">
<h1 id="bag-title" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em;">Your bag</h1>
<a href="shop.html" style="font-size: 15px; font-weight: 500;">Keep shopping</a>
</div>

<template data-if="{{empty}}">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; gap: 14px; align-items: flex-start;">
<h2 style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">Your bag is empty.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240;">Save your fit first, and every page shows your size.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px;"><a href="shop.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;">Shop all</a><a href="fit.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: transparent; color: #1B2240; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;">Find your size</a></div>
</div>
</template>

<template data-if="{{full}}">
<div style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-start;">
<ul aria-label="Items in your bag" style="flex: 2 1 520px; min-width: 0; margin: 0; padding: 0; list-style: none; border-top: 1px solid #1B2240;">
<template data-for="{{lines}}" data-as="it">
<li style="display: flex; flex-wrap: wrap; gap: 20px; padding: 24px 0; border-bottom: 1px solid #D3D7E0;">
<a href="{{it.href}}" style="flex: 0 0 120px;"><img src="{{it.img}}" alt="{{it.alt}}" style="width: 120px; aspect-ratio: 3 / 4; object-fit: cover; background: {{it.bg}}; display: block;"></a>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600;">{{it.name}}</h2>
<p style="margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;">{{it.lineTotal}}</p>
</div>
<p style="margin: 0; font-size: 15px; color: #596079;">{{it.sub}}</p>
<template data-if="{{it.held}}">
<p style="margin: 4px 0 0; font-size: 14px; background: #EFE8DA; padding: 6px 10px; align-self: flex-start;">One of one · held for you for 15 minutes</p>
</template>
<template data-if="{{showFit}}">
<p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #596079;">{{it.fit}}</p>
</template>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 8px;">
<template data-if="{{it.qtyEditable}}">
<div role="group" aria-label="{{it.qtyLabel}}" style="display: flex; align-items: center; border: 1px solid #1B2240;">
<button type="button" onClick="{{it.dec}}" aria-label="One fewer" style="font-family: inherit; width: 44px; height: 44px; font-size: 18px; background: #FFFFFF; border: 0; color: #1B2240; cursor: pointer;">−</button>
<span style="min-width: 32px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums;">{{it.qty}}</span>
<button type="button" onClick="{{it.inc}}" aria-label="One more" style="font-family: inherit; width: 44px; height: 44px; font-size: 18px; background: #FFFFFF; border: 0; color: #1B2240; cursor: pointer;">+</button>
</div>
</template>
<a href="{{it.href}}" style="font-size: 14px;">{{it.change}}</a>
<button type="button" onClick="{{it.remove}}" style="font-family: inherit; font-size: 14px; background: none; border: 0; padding: 10px 0; color: #1B2240; text-decoration: underline; cursor: pointer;">Remove</button>
</div>
</div>
</li>
</template>
</ul>

<aside aria-label="Order summary" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600;">Summary</h2>
<div style="display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums;"><span>Subtotal</span><span>{{subtotal}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px;"><span>Delivery, UK [2–4] days</span><span>[£X.XX]</span></div>
<div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; border-top: 1px solid #1B2240; padding-top: 12px; font-variant-numeric: tabular-nums;"><span>Total</span><span>{{subtotal}} + delivery</span></div>
<a href="order.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: #1B2240; color: #FFFFFF; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%; min-height: 52px; font-size: 16px;">Check out</a>
<a href="order.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 24px; background: transparent; color: #1B2240; border: 1px solid #1B2240; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; width: 100%;">Express checkout</a>
<ul style="margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: #596079;">
<li>Wrong size? Swap it free within [30] days.</li>
<li>Returns within [14] days, one-of-ones included.</li>
<li>You see delivery and any duties before you pay.</li>
</ul>
</div>
<figure style="margin: 0; background: #FFFFFF; border: 1px solid #D3D7E0; display: flex; gap: 14px; align-items: center; padding: 12px;">
<img src="assets/img/print-unboxing.webp" alt="A folded paper jeans card being pulled from a kraft envelope in an opened parcel." style="width: 88px; height: 88px; object-fit: cover;">
<figcaption style="font-size: 14px; line-height: 1.5;">Every parcel comes with a paper pair to unfold and a card for your back pocket.</figcaption>
</figure>
</aside>
</div>
</template>
</section>

<footer style="background: #1B2240; color: #EEF0F4;">
<div style="max-width: 1440px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: space-between;">
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 420px;"><p role="img" aria-label="Notch" style="margin: 0 0 8px;"><svg aria-hidden="true" viewBox="0 0 376 140" style="height: 34px; width: auto; display: block;"><path d="M0 40 H72 V140 H44 V76 H28 V140 H0 Z M104 40 H136 A20 20 0 0 1 156 60 V120 A20 20 0 0 1 136 140 H104 A20 20 0 0 1 84 120 V60 A20 20 0 0 1 104 40 Z M120 75 A15 15 0 1 0 120 105 A15 15 0 1 0 120 75 Z M180 14 H204 V40 H214 V60 H204 V140 H180 V60 H168 V40 H180 Z M226 40 H292 V80 H250 V100 H292 V140 H226 Z M304 0 H330 V40 H376 V140 H348 V76 H332 V140 H304 Z" fill="#EEF0F4" fill-rule="evenodd"></path></svg></p><label for="ft-email" style="font-size: 15px; line-height: 1.5;">Hear when a Drop has a pair in your size.</label><div style="display: flex; gap: 0;"><input id="ft-email" type="email" placeholder="Email" autocomplete="email" style="flex: 1 1 auto; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; font-family: inherit; font-size: 15px; border: 1px solid #EEF0F4; background: transparent; color: #EEF0F4;"><button type="submit" style="height: 46px; padding: 0 18px; font-family: inherit; font-size: 15px; font-weight: 600; background: #EEF0F4; color: #1B2240; border: 1px solid #EEF0F4; cursor: pointer;">Sign up</button></div><p style="margin: 0; font-size: 13px; color: #B9BED3;">Instagram · TikTok · Pinterest [@handle]</p></form>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px;"><nav aria-label="Shop" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Shop</p><a href="shop.html" style="color: #EEF0F4; text-decoration: none;">All cuts</a><a href="drop.html" style="color: #EEF0F4; text-decoration: none;">Drop 01</a><a href="fit.html" style="color: #EEF0F4; text-decoration: none;">Fit finder</a></nav><nav aria-label="Help" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Help</p><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Delivery</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size swaps and returns</a><a href="help.html" style="color: #EEF0F4; text-decoration: none;">Size tables</a><a href="account.html" style="color: #EEF0F4; text-decoration: none;">Your orders</a></nav><nav aria-label="Notch" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 140px;"><p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #B9BED3;">Notch</p><a href="about.html" style="color: #EEF0F4; text-decoration: none;">How we cut</a><a href="stockists.html" style="color: #EEF0F4; text-decoration: none;">For shops and press</a></nav></div>
</div>
<p style="max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 56px) 28px; box-sizing: border-box; font-size: 12.5px; color: #B9BED3; border-top: 1px solid #2E3762;">Concept project by Yas Dastan. Products, prices, measurements and people are generated for this portfolio piece. Bracketed values are placeholders.</p>
</footer>
</div>
</template>
<script src="js/morphdom.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: 0 }; }
  renderVals() {
    var self = this, saved = this.props.savedFit ?? true, a = NotchStore.get();
    var lines = a.map(function (it) {
      var hand = !!it.single;
      return { name: it.name, img: it.img, alt: it.alt, bg: hand ? '#EFE8DA' : '#FFFFFF', sub: it.size + (hand ? '' : ' · £' + it.price + ' each'),
        fit: it.fit || '', held: hand, qtyEditable: !hand, qty: it.qty, lineTotal: '£' + it.qty * it.price, qtyLabel: 'Quantity of ' + it.name,
        href: it.href, change: hand ? 'See its measurements' : 'Change size',
        inc: function () { NotchStore.setQty(it.key, it.qty + 1); self.setState({ v: self.state.v + 1 }); },
        dec: function () { NotchStore.setQty(it.key, it.qty - 1); self.setState({ v: self.state.v + 1 }); },
        remove: function () { NotchStore.remove(it.key); self.setState({ v: self.state.v + 1 }); } };
    });
    return { lines: lines, showFit: saved, subtotal: '£' + NotchStore.total(), count: String(NotchStore.count()), empty: lines.length === 0, full: lines.length > 0, noSubmit: function (e) { e.preventDefault(); } };
  }
}
DC.mount(Component, {"savedFit": true});
</script>
</body>
</html>
