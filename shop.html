 6px; padding: 14px 0;">Help</a></nav></details></div>

<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { w: 2, l: 1, drawer: null, bag: [] }; }
  renderVals() {
    var self = this, st = this.state, saved = this.props.savedFit ?? true;
    var sizes = [72, 76, 80, 84, 88, 92], lens = [['Short', 71], ['Regular', 76], ['Long', 81]];
    var pair = { waist: 80, hip: 107, thigh: 65, inseam: 78 };
    var any = st.w < 0;
    var W = any ? 80 : sizes[st.w], L = lens[st.l];
    var on = function (b) { return { on: b ? 'true' : 'false', bg: b ? '#1B2240' : '#FFFFFF', fg: b ? '#FFFFFF' : '#1B2240' }; };
    var waists = [Object.assign({ label: 'Any', pick: function () { self.setState({ w: -1 }); } }, on(any))].concat(sizes.map(function (z, i) { return Object.assign({ label: 'W' + z, pick: function () { self.setState({ w: i }); } }, on(i === st.w)); }));
    var lengths = lens.map(function (x, i) { return Object.assign({ label: x[0] + ' · ' + x[1], pick: function () { self.setState({ l: i }); } }, on(i === st.l)); });
    var k = (W - 80) / 4;
    var word = function (v, more, less) { v = Math.round(v * 10) / 10; return Math.abs(v) < 1.5 ? null : Math.abs(v) + ' cm ' + (v > 0 ? more : less); };
    var src = [
      { name: 'Straight', wash: 'Rinse', price: 68, hip: 106, thigh: 64, img: 'assets/img/st-front.webp', alt: 'Straight cut in dark rinse denim, front view.', low: [] },
      { name: 'Wide', wash: 'Ecru', price: 74, hip: 112, thigh: 72, img: 'assets/img/wd-front.webp', alt: 'Wide cut in ecru denim, front view.', low: [92] },
      { name: 'Taper', wash: 'Light', price: 70, hip: 108, thigh: 66, img: 'assets/img/tp-front.webp', alt: 'Taper cut in light-wash denim, front view.', low: [72, 92] }
    ];
    var sizeShort = 'W' + W + ' ' + L[0];
    var cuts = src.map(function (c) {
      var hip = c.hip + 4 * k, thigh = c.thigh + 2.4 * k, low = c.low.indexOf(W) >= 0;
      var notes = [word(hip - pair.hip, 'roomier at the hip', 'closer at the hip'), word(thigh - pair.thigh, 'more room in the thigh', 'slimmer in the thigh')].filter(Boolean);
      return { name: c.name, wash: c.wash, price: '£' + c.price, img: c.img, alt: c.alt, sizeShort: sizeShort,
        stock: any ? 'W72–W92 · Short, Regular, Long' : sizeShort + (low ? ' · last 2' : ' · in stock'), stockColor: low ? '#A3171C' : any ? '#596079' : '#1E6B3C',
        showFit: saved && !any, fit: 'vs your pair: ' + (notes.length ? notes.join(', ') : 'within 1.5 cm everywhere'),
        canAdd: !any,
        add: function () { notchAdd({ key: c.name + '|' + sizeShort, name: c.name + ' · ' + c.wash, size: sizeShort, price: c.price, img: c.img, alt: c.alt, href: 'product.html', fit: saved ? 'Fit check: ' + (notes.length ? notes.join(', ') : 'within 1.5 cm of your pair everywhere') + '.' : '' }); var b = st.bag.concat([{ name: c.name + ' · ' + c.wash, price: c.price }]); self.setState({ bag: b, drawer: { name: c.name + ' · ' + c.wash, size: sizeShort, price: '£' + c.price, img: c.img, alt: c.alt, fit: saved ? 'Fit check: ' + (notes.length ? notes.join(', ') : 'within 1.5 cm of your pair everywhere') + '.' : 'Not sure about the size? Swaps are free within [30] days.' } }); } };
    });
    var drops = [
      { name: 'H1 · Poppy marks', base: 'Ecru Wide', w: 80, l: 'Regular', state: 'free', img: 'assets/img/h1-front.webp', alt: 'H1: ecru wide jeans with hand-printed poppy and peony marks.' },
      { name: 'H2 · Seam dashes', base: 'Rinse Straight', w: 84, l: 'Long', state: 'free', img: 'assets/img/h2-front.webp', alt: 'H2: rinse straight jeans with chartreuse dashes down the side seam.' },
      { name: 'H3 · Hem bands', base: 'Ecru Taper', w: 76, l: 'Short', state: 'bag', img: 'assets/img/h3-front.webp', alt: 'H3: ecru taper jeans with ultramarine and lilac hem bands.' },
      { name: 'H4 · One peony', base: 'Light Straight', w: 88, l: 'Regular', state: 'sold', img: 'assets/img/h4-back.webp', alt: 'H4: light-wash straight jeans with one peony shape on the back thigh.' }
    ];
    var hand = drops.map(function (d) {
      var mine = !any && d.w === W && d.l === L[0];
      var tag = d.state === 'sold' ? 'Sold' : d.state === 'bag' ? 'In a bag' : mine ? 'Your size' : 'Available';
      return { name: d.name, img: d.img, alt: d.alt, tag: tag, tagBg: mine && d.state === 'free' ? '#E5452F' : '#FFFFFF', fade: d.state === 'sold' ? 0.5 : 1, sub: d.base + ' · W' + d.w + ' ' + d.l + ' only' };
    });
    hand.forEach(function (h) { if (h.tagBg === '#E5452F') h.tagBg = '#F2B8A8'; });
    var total = st.bag.reduce(function (a, b) { return a + b.price; }, 0);
    var dr = st.drawer || {};
    return {
      waists: waists, lengths: lengths, cuts: cuts, hand: hand,
      sizeLabel: any ? 'Any size' : sizeShort + (saved && st.w === 2 && st.l === 1 ? ' (from your saved fit)' : ''),
      fitStatus: saved ? 'Comparing with my grey straights.' : 'Know a pair that fits?', fitLink: saved ? 'Edit' : 'Find your size', fitHref: saved ? 'account.html' : 'fit.html',
      noSubmit: function (e) { e.preventDefault(); },
      bagCount: String(st.bag.length), bagTotal: '£' + total,
      drawerOpen: !!st.drawer, closeDrawer: function () { self.setState({ drawer: null }); },
      dName: dr.name, dSize: dr.size, dPrice: dr.price, dImg: dr.img, dAlt: dr.alt, dFit: dr.fit
    };
  }
}

DC.mount(Component, {"savedFit": true});
</script>
