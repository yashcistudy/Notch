<section aria-labelledby="about-title" style="display: flex; flex-wrap: wrap; background: #FFFFFF; border-bottom: 1px solid #D3D7E0;">
<div style="flex: 1 1 400px; padding: clamp(32px, 5vw, 80px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 18px;">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #596079;">How we cut</p>
<h1 id="about-title" style="margin: 0; font-family: 'Piscolabis', 'Figtree', sans-serif; font-weight: 400; font-size: clamp(44px, 5.2vw, 76px); line-height: 1.08; letter-spacing: 0.01em;">Why it's called Notch</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 17px; max-width: 520px;">Patternmakers cut small slots into the edges of a pattern so the pieces line up when they're sewn. They're called notches. Our logo is made from them: the gaps in the n, c and h are notches, and the hole in the o is where a pattern hangs on a rail.</p>
</div>
<div style="flex: 1.3 1 520px; min-height: clamp(320px, 40vw, 620px); position: relative; overflow: hidden;">
<img src="assets/img/print-pattern-table.webp" alt="Three paper jeans cards on a green cutting mat with a notcher, a tape measure, a pencil and pattern weights." style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
</div>
</section>

<section aria-labelledby="marks-title" style="max-width: 1440px; margin: 0 auto; padding: clamp(48px, 6vw, 96px) clamp(16px, 4vw, 56px); box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
<h2 id="marks-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">Three marks from the pattern room</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<svg viewBox="0 0 120 70" style="width: 100%; max-width: 220px; height: auto;" role="img" aria-label="A pattern edge with one notch cut into it."><path d="M0 10 H120 V70 H0 Z M58 10 V24 H62 V10 Z" fill="#E2D5B0" fill-rule="evenodd"></path><path d="M0 10 H58 V24 H62 V10 H120" fill="none" stroke="#1B2240" stroke-width="1.2"></path></svg>
<p style="margin: 0; font-size: 17px; font-weight: 600;">One notch</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">Usually marks the front of a pattern piece. It's the slot in our n, and every paper card has one at the hip.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<svg viewBox="0 0 120 70" style="width: 100%; max-width: 220px; height: auto;" role="img" aria-label="A pattern edge with two notches cut into it."><path d="M0 10 H120 V70 H0 Z M50 10 V24 H54 V10 Z M66 10 V24 H70 V10 Z" fill="#E2D5B0" fill-rule="evenodd"></path><path d="M0 10 H50 V24 H54 V10 H66 V24 H70 V10 H120" fill="none" stroke="#1B2240" stroke-width="1.2"></path></svg>
<p style="margin: 0; font-size: 17px; font-weight: 600;">Two notches</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">Usually mark the back. On our hangtags the number of slots tells you the length: one for Short, two for Regular, three for Long.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D3D7E0; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<svg viewBox="0 0 120 70" style="width: 100%; max-width: 220px; height: auto;" role="img" aria-label="A pattern corner with a round hanging hole."><path d="M0 10 H120 V70 H0 Z M52 25 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z" fill="#E2D5B0" fill-rule="evenodd"></path><circle cx="60" cy="25" r="8" fill="none" stroke="#1B2240" stroke-width="1.2"></circle></svg>
<p style="margin: 0; font-size: 17px; font-weight: 600;">The hanging hole</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">Patterns hang on a rail from a punched hole. That's the o in our name, and the eyelet on each card.</p>
</div>
</div>
</section>

<section aria-labelledby="steps-title" style="background: #FFFFFF; border-top: 1px solid #D3D7E0; border-bottom: 1px solid #D3D7E0;">

<h2 id="steps-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">How a pair gets made</h2>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;">
<li style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1B2240; padding-top: 14px;"><span style="font-size: 13px; color: #596079;">1</span><span style="font-size: 17px; font-weight: 600;">Pattern</span><span style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">All three cuts come from one base pattern. We sew a W80 Regular sample and measure it.</span></li>
<li style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1B2240; padding-top: 14px;"><span style="font-size: 13px; color: #596079;">2</span><span style="font-size: 17px; font-weight: 600;">Cut</span><span style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">13 oz cotton with no stretch, in rinse, ecru and a light wash.</span></li>
<li style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1B2240; padding-top: 14px;"><span style="font-size: 13px; color: #596079;">3</span><span style="font-size: 17px; font-weight: 600;">Print, for Hand pairs</span><span style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">We press each mark with a wooden block, then measure the pair again.</span></li>
<li style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1B2240; padding-top: 14px;"><span style="font-size: 13px; color: #596079;">4</span><span style="font-size: 17px; font-weight: 600;">Paper card</span><span style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; font-size: 15px;">Each cut gets a card at a fifth of its size, with its measurements on the back. One goes in your parcel.</span></li>
</ol>

<h2 id="print-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">How the hand-printed pairs are made</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240;">We press every mark by hand, so the ink never lands the same way twice. That's why each Hand pair has its own page, with measurements we took after the ink dried.</p>

<div style="flex: 1.2 1 380px; display: flex; flex-direction: column; gap: 16px;">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #596079;">Paper cards</p>
<h2 id="paper-title" style="margin: 0; font-size: clamp(24px, 2.4vw, 32px); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em;">The jeans, small enough to hang on a hook</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #1B2240; max-width: 520px;">In shops that stock us, every cut hangs on the rail as a card. On the back you'll find the hip, thigh, knee, hem and inseam, drawn where they're measured.</p>
